[project]
name = "calibrator"
version = "0.1.0"
description = "High-performance camera calibration CLI for video and live camera capture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tqdm>=4.70.1",
]

[project.scripts]
calibrate = "calibrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

